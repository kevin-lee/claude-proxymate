name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Scala Native 0.5.x release builds default to trap-based GC yieldpoints, which
# lose fault delivery under concurrent load on macOS and wedge the proxy binary.
# The toolchain reads this from the sbt JVM's environment at link time, and
# build.sbt's checkNativeLinkEnv refuses proxyServer / Compile / nativeLink
# without it. Workflow-level so every job's sbt sees it. Keep in sync with
# build.yml.
env:
  SCALANATIVE_GC_TRAP_BASED_YIELDPOINTS: "0"

# Read-only by default. The release job alone gets contents: write, for the
# GitHub release. The tap job pushes a branch to kevin-lee/homebrew-tap and
# opens a pull request there with HOMEBREW_TAP_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: sbt/setup-sbt@b113b960ba361e87e08ce02a390d51871b7ee459 # v1.5.13

      - name: Run core tests
        run: sbt "clean; coreJVM/test; coreJS/test; coreNative/test; proxyServer/test; renderer/test"

  build:
    needs: test
    # The signing, notarization and GA secrets are environment secrets of
    # `release`. Its deployment rule allows only tags that match v*, so this
    # job runs for a v* tag push or a dispatch on a v* tag. A dispatch on a
    # branch is refused here, and release and tap are then skipped.
    environment: release
    # Scala.js fullLinkJS (Closure full optimization) is heap-hungry; the sbt
    # launcher default of 1 GB OOMs during the renderer link. .jvmopts sets the
    # heap for local + CI builds; this reasserts it in CI in case a runner image
    # ignores .jvmopts. Keep the two in sync.
    env:
      SBT_OPTS: "-Xms1G -Xmx4G -XX:+UseG1GC -XX:ReservedCodeCacheSize=512m"
    strategy:
      # One arch failing must not cancel the other: the surviving job's log is
      # what tells us whether a failure is arch-specific (a runner image, a
      # native binary) or common to both. v0.4.0's first attempt cancelled the
      # x64 job mid-build, leaving only the arm64 signing failure to go on.
      fail-fast: false
      matrix:
        include:
          # Apple Silicon runner → arm64 build
          - os: macos-latest
            arch: arm64
          # Intel runner → x64 build. Required: the Scala Native proxy binary is
          # compiled for the host CPU, so an arm64 runner would produce an x64
          # DMG containing an arm64 binary that cannot run on Intel Macs.
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}

    steps:
      # electron-builder does not fail without signing credentials. It ad-hoc
      # signs and skips notarization, and build.sbt builds without analytics
      # when the GA values are empty. A release must not ship like that, so
      # stop before anything is built. This tests presence only and never
      # prints a value.
      - name: Require the release secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
        run: |
          MISSING=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID GA_MEASUREMENT_ID GA_API_SECRET; do
            if [ -z "${!name}" ]; then
              echo "error: release environment secret $name is not set"
              MISSING=1
            fi
          done
          exit "$MISSING"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: sbt/setup-sbt@b113b960ba361e87e08ce02a390d51871b7ee459 # v1.5.13

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

#      - name: Build native proxy binary
#        run: sbt proxyServer/nativeLink
#
#      - name: Build Scala.js Electron main
#        run: sbt electron/fullLinkJS
      - name: Build binary for production
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
        run: sbt "clean; prodUi"

#      - name: Assemble electron-app
#        run: |
#          cp modules/claude-proxymate-server/target/scala-3.3.7/claude-proxymate-server-out electron-app/claude-proxy
#          chmod +x electron-app/claude-proxy
#          cp modules/claude-proxymate-electron/target/scala-3.3.7/claude-proxymate-electron-opt/main.js electron-app/main.js
#          cp -r public electron-app/public
#          cp -r assets electron-app/assets

      - name: Install Electron dependencies
        run: cd electron-app && npm install

      # Signs with the Developer ID cert from CSC_LINK and notarizes via the
      # APPLE_* credentials ("notarize": true in project/package.json.template;
      # hardenedRuntime + entitlements are configured there too). Required
      # `release` environment secrets:
      #   CSC_LINK                     base64-encoded Developer ID .p12
      #   CSC_KEY_PASSWORD             password for the .p12
      #   APPLE_ID                     Apple ID email of the developer account
      #   APPLE_APP_SPECIFIC_PASSWORD  app-specific password (appleid.apple.com)
      #   APPLE_TEAM_ID                10-char team ID
      # Degradation is graceful and verified against app-builder-lib source:
      # with NO credentials set, electron-builder ad-hoc signs and skips
      # notarization with a warning (downloaders then need the Gatekeeper
      # workaround in the README); with PARTIAL credentials it fails the build.
      # This job does not use that fallback: "Require the release secrets"
      # stops the job when a credential is missing, and Verify DMG requires a
      # Developer ID signature, notarization and a stapled ticket.
      #
      # electron-builder must be >= 26.18.1 (pinned in
      # project/package.json.template). Up to 26.15.3 it passed the .p12
      # password to `security set-key-partition-list -k`, which wants the
      # temporary keychain's own password. That mismatch was harmless while
      # macos-latest was macOS 15 or older, because SecKeychainUnlock returned
      # success on an already-unlocked keychain, and became fatal the moment
      # macos-latest moved to macOS 26 ("SecKeychainUnlock: The user name or
      # passphrase you entered is not correct", v0.4.0's first attempt).
      # Beware the version range: npm prefers the version tagged `latest` over
      # any higher one that also satisfies the range, and 26.16.x shipped under
      # the `v26` tag while `latest` stayed on the broken 26.15.3, so `^26.8.1`
      # resolved to 26.15.3. The floor has to sit above `latest` to win.
      # The same holds for 26.18.1, the newest 26.x (tag `v26`) while
      # `latest` is 26.18.0.
      #
      # Self-update: mac.target also builds a zip, the payload Squirrel.Mac
      # installs, and the GitHub `publish` config makes electron-builder embed
      # Contents/Resources/app-update.yml in the app before signing. The
      # build stays `--publish never`: nothing is uploaded and no token is
      # needed. The latest-mac.yml each runner writes lists only its own arch,
      # so it is not uploaded. The release job writes the merged one.
      #
      # The template's mac.target deliberately has NO "arch" list: an explicit
      # arch list in config overrides the CLI --arm64/--x64 flag, which made
      # each runner cross-build BOTH arches. The x64 DMG built on the arm64
      # runner contained an arm64 native proxy binary (broken on Intel), and
      # the duplicate filenames across artifacts corrupted the merged release
      # assets (v0.1.0). Keep arch selection on the CLI flag only.
      # Do NOT set CSC_IDENTITY_AUTO_DISCOVERY=false here: it suppresses
      # electron-builder's ad-hoc signing fallback and yields an app with no
      # bundle seal, which macOS reports as "damaged" with no Open Anyway
      # escape (v0.1.0). With auto-discovery on and no identity in the
      # keychain, electron-builder ad-hoc signs, giving downloaders the
      # recoverable Gatekeeper flow instead.
      - name: Package with electron-builder
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # electron-builder staples the notarization ticket as its last step.
        # Stapling downloads the ticket from Apple's CloudKit server, and the
        # connection from the hosted runners sometimes drops ("Failed to
        # staple your application with code: 68"). Run the build again only
        # for that error. Any other error fails at once.
        run: |
          set -uo pipefail
          cd electron-app
          LOG="$RUNNER_TEMP/electron-builder.log"
          for attempt in 1 2 3; do
            if npx electron-builder --mac --${{ matrix.arch }} --publish never 2>&1 | tee "$LOG"; then
              exit 0
            fi
            if ! grep -q "Failed to staple your application" "$LOG"; then
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: stapling failed 3 times"
              exit 1
            fi
            echo "Stapling failed (attempt $attempt), building again in 60s"
            sleep 60
            rm -rf release
          done

      # Guard against the failure modes that broke v0.1.0: a runner building
      # more than its own arch, a DMG whose bundled native proxy binary doesn't
      # match the DMG's arch, and an app that isn't actually Developer-ID
      # signed + notarized + stapled. The zip holds the app that self-update
      # installs, so it gets the same checks, plus the updater config.
      - name: Verify DMG and zip
        run: |
          set -euo pipefail
          cd electron-app/release
          DMGS=(*.dmg)
          if [ "${#DMGS[@]}" -ne 1 ]; then
            echo "Expected exactly 1 DMG for ${{ matrix.arch }}, got: ${DMGS[*]}"
            exit 1
          fi
          ZIPS=(*.zip)
          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "Expected exactly 1 zip for ${{ matrix.arch }}, got: ${ZIPS[*]}"
            exit 1
          fi
          EXPECTED="${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"
          # verify_app <app>: signature, notarization, stapled ticket and arch.
          verify_app() {
            local app="$1"
            # At minimum an ad-hoc signature with a valid resource seal; a
            # seal-less app is reported by macOS as "damaged" with no recovery.
            codesign --verify --deep --strict "$app"
            # Fail the release if the app is not Developer-ID signed, accepted
            # by Gatekeeper as notarized, and carrying a stapled ticket.
            codesign -dvvv "$app" 2>&1 | grep "Authority=Developer ID Application"
            spctl -a -vvv "$app"
            # stapler validate looks the ticket up on Apple's CloudKit server.
            # The connection from the hosted runners sometimes drops (error 68,
            # NSURLErrorDomain -1005), so retry before failing the release.
            local attempt
            for attempt in 1 2 3 4 5; do
              if xcrun stapler validate "$app"; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "ERROR: stapler validate failed 5 times for $app"
                exit 1
              fi
              echo "stapler validate failed (attempt $attempt), retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            done
            for bin in "Contents/MacOS/Claude Proxymate" "Contents/Resources/claude-proxymate"; do
              ARCH_INFO=$(file "$app/$bin")
              echo "$ARCH_INFO"
              if ! echo "$ARCH_INFO" | grep -q "$EXPECTED"; then
                echo "ERROR: $bin is not $EXPECTED"
                exit 1
              fi
            done
          }
          hdiutil verify "${DMGS[0]}"
          MNT=$(hdiutil attach "${DMGS[0]}" -nobrowse -readonly | awk -F'\t' '/\/Volumes\//{print $NF}')
          trap 'hdiutil detach "$MNT" -quiet' EXIT
          verify_app "$MNT/Claude Proxymate.app"
          ZIPCHECK="$RUNNER_TEMP/zipcheck"
          rm -rf "$ZIPCHECK"
          mkdir -p "$ZIPCHECK"
          ditto -x -k "${ZIPS[0]}" "$ZIPCHECK"
          verify_app "$ZIPCHECK/Claude Proxymate.app"
          # electron-updater reads its feed from this file. It is inside the
          # signature, so it must already be right here.
          UPDATE_YML="$ZIPCHECK/Claude Proxymate.app/Contents/Resources/app-update.yml"
          cat "$UPDATE_YML"
          for line in "provider: github" "owner: kevin-lee" "repo: claude-proxymate"; do
            if ! grep -qx "$line" "$UPDATE_YML"; then
              echo "ERROR: app-update.yml has no '$line'"
              exit 1
            fi
          done

      # Taken after electron-builder has finished and the read-only
      # verification above has run, so they describe the bytes that are
      # uploaded and published. The release and tap jobs check every copy
      # against them. Verify DMG and zip has already checked that there is
      # exactly one DMG and one zip.
      - name: Write the checksums
        run: |
          set -euo pipefail
          cd electron-app/release
          for file in *.dmg *.zip; do
            shasum -a 256 "$file" > "$file.sha256"
            shasum -a 256 -c "$file.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: |
            electron-app/release/*-${{ matrix.arch }}.dmg
            electron-app/release/*-${{ matrix.arch }}.dmg.sha256
            electron-app/release/*-${{ matrix.arch }}.zip
            electron-app/release/*-${{ matrix.arch }}.zip.sha256
            electron-app/release/*-${{ matrix.arch }}.zip.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # softprops/action-gh-release creates the GitHub release and uploads the
    # DMGs and checksums to it, which needs contents: write.
    permissions:
      contents: write
    steps:
      # This repository, for scripts/write-latest-mac-yml.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      # Each artifact carries only its own arch's files, so merge-multiple
      # cannot collide. Assert we have exactly one DMG, one zip, one zip
      # blockmap and their checksum files per arch, and that every DMG and zip
      # matches the checksum written in its build job, before publishing
      # anything.
      - name: Sanity-check artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          ls -la artifacts/
          for arch in arm64 x64; do
            for pattern in "*-$arch.dmg" "*-$arch.dmg.sha256" "*-$arch.zip" "*-$arch.zip.sha256" "*-$arch.zip.blockmap"; do
              # The pattern is a glob on purpose.
              # shellcheck disable=SC2206
              FILES=(artifacts/$pattern)
              if [ "${#FILES[@]}" -ne 1 ]; then
                echo "ERROR: expected exactly 1 $pattern, found ${#FILES[@]}"
                exit 1
              fi
            done
          done
          (cd artifacts && sha256sum -c ./*.sha256)

      # The electron-updater feed for both arches. It goes up together with
      # the zips it names, after both arch builds have passed.
      - name: Write latest-mac.yml
        run: |
          set -euo pipefail
          scripts/write-latest-mac-yml.sh "${GITHUB_REF_NAME#v}" artifacts
          cat artifacts/latest-mac.yml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.zip.blockmap
            artifacts/**/*.sha256
            artifacts/latest-mac.yml
          generate_release_notes: true

  tap:
    needs: release
    # brew style needs Homebrew.
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    # HOMEBREW_TAP_TOKEN is an environment secret of `release`, whose
    # deployment rule allows only tags that match v*.
    environment: release
    steps:
      - name: Require the tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "error: release environment secret HOMEBREW_TAP_TOKEN is not set"
            exit 1
          fi

      # This repository, for scripts/update-cask.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevin-lee/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # One claude-proxymate tap PR at a time. The tap deletes a branch when its
      # PR is merged, so a claude-proxymate/* branch still there is this
      # release's branch from an earlier run, or an earlier release's PR that is
      # open or was closed without merging. Either needs a look by hand. Going
      # on would fail at the push after the cask work, or pin the wrong previous
      # version and open a PR that conflicts with the open one.
      - name: Require no pending claude-proxymate tap branch
        run: |
          set -euo pipefail
          BRANCHES="$(git -C tap ls-remote --heads origin 'refs/heads/claude-proxymate/*' | awk '{print $2}' | sed 's|^refs/heads/||')"
          if [ -n "$BRANCHES" ]; then
            echo "error: kevin-lee/homebrew-tap already has these claude-proxymate branches. Merge or close their PRs and delete the branches, then re-run this job:"
            while IFS= read -r branch; do
              echo "  - $branch"
            done <<< "$BRANCHES"
            exit 1
          fi
          echo "No pending claude-proxymate branch in kevin-lee/homebrew-tap."

      # The published release assets are what brew downloads, so they are the
      # files checked. Each DMG is checked against the .sha256 written in its
      # build job, so a corrupted download fails here instead of reaching the
      # cask.
      - name: Download the published DMGs and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --pattern '*.dmg.sha256' --dir release-assets
          ls -la release-assets

      - name: Update the cask
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for arch in arm64 x64; do
            NAME="Claude-Proxy-$VERSION-$arch.dmg"
            for file in "release-assets/$NAME" "release-assets/$NAME.sha256"; do
              if [ ! -f "$file" ]; then
                echo "error: $file not found"
                exit 1
              fi
            done
            (cd release-assets && shasum -a 256 -c "$NAME.sha256")
          done
          ARM="$(awk '{print $1}' "release-assets/Claude-Proxy-$VERSION-arm64.dmg.sha256")"
          X64="$(awk '{print $1}' "release-assets/Claude-Proxy-$VERSION-x64.dmg.sha256")"
          scripts/update-cask.sh "$VERSION" "$ARM" "$X64" tap
          git -C tap add Casks

      # brew style only inspects casks that live inside a tap directory, so the
      # checkout is linked into Homebrew's taps folder under the real tap name
      # and the casks are named by token. Only the changed casks are checked,
      # so older hand-written casks cannot fail a release under newer RuboCop
      # rules.
      - name: Check the cask style
        run: |
          set -euo pipefail
          TAP_DIR="$(brew --repository)/Library/Taps/kevin-lee/homebrew-tap"
          mkdir -p "$(dirname "$TAP_DIR")"
          ln -sfn "$GITHUB_WORKSPACE/tap" "$TAP_DIR"
          TOKENS=()
          while IFS= read -r cask; do
            TOKENS+=("kevin-lee/tap/$(basename "$cask" .rb)")
          done < <(git -C tap diff --cached --name-only -- Casks)
          if [ "${#TOKENS[@]}" -eq 0 ]; then
            echo "No cask changes to check."
            exit 0
          fi
          brew style --cask "${TOKENS[@]}"

      # The release goes to the tap as a pull request from
      # claude-proxymate/<version>, not a push to main, so it is reviewed and
      # merged by hand. The push has no --force, and the step above has checked
      # that no such branch exists. The PR is assigned to kevin-lee and labelled
      # pr. Do not label it pr-pull. The tap's publish.yml runs brew pr-pull on
      # that label, which is for bottled formulae.
      - name: Commit, push the branch and open the PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          cd tap
          if git diff --cached --quiet; then
            echo "No cask changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="${GITHUB_REF_NAME#v}"
          TITLE="Update \`claude-proxymate\` to \`$VERSION\`"
          PREVIOUS=""
          PREVIOUS_FILE=$(git diff --cached --name-only --diff-filter=A | grep 'Casks/claude-proxymate@' | sort -V | tail -n 1 || true)
          if [ -n "$PREVIOUS_FILE" ]; then
            PREVIOUS=$(basename "$PREVIOUS_FILE" .rb)
            PREVIOUS="${PREVIOUS#claude-proxymate@}"
            TITLE="$TITLE and add versioned cask for \`$PREVIOUS\`"
          fi
          if [ -n "$PREVIOUS" ]; then
            git commit -m "$TITLE" -m "- \`claude-proxymate\`: \`$PREVIOUS\` => \`$VERSION\`"
          else
            git commit -m "$TITLE"
          fi
          BRANCH="claude-proxymate/$VERSION"
          git push origin "HEAD:refs/heads/$BRANCH"
          RELEASE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BODY_FILE="$RUNNER_TEMP/tap-pr-body.md"
          # The backticks are literal Markdown for the PR body.
          # shellcheck disable=SC2016
          {
            echo '## Changes'
            echo
            if [ -n "$PREVIOUS" ]; then
              printf -- '- `claude-proxymate`: `%s` => `%s` ([release %s](%s))\n' "$PREVIOUS" "$VERSION" "$GITHUB_REF_NAME" "$RELEASE_URL"
              echo
              printf 'Add `Casks/claude-proxymate@%s.rb` so `%s` stays installable after the bump.\n' "$PREVIOUS" "$PREVIOUS"
            else
              printf -- '- `claude-proxymate`: `%s` ([release %s](%s))\n' "$VERSION" "$GITHUB_REF_NAME" "$RELEASE_URL"
            fi
            echo
            echo '## Verification'
            echo
            printf -- '- `Claude-Proxy-%s-arm64.dmg` and `Claude-Proxy-%s-x64.dmg` downloaded from the published release, and each matched its published `.sha256` with `shasum -a 256 -c`\n' "$VERSION" "$VERSION"
            echo '- `brew style --cask` on the changed casks - no offenses'
            echo '- `brew audit` and `brew install` were not run'
            echo
            printf 'Workflow run: %s\n' "$RUN_URL"
          } > "$BODY_FILE"
          gh pr create --repo kevin-lee/homebrew-tap --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE" --assignee kevin-lee --label pr
