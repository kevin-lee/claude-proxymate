name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Scala Native 0.5.x release builds default to trap-based GC yieldpoints, which
# lose fault delivery under concurrent load on macOS and wedge the proxy binary.
# The toolchain reads this from the sbt JVM's environment at link time, and
# build.sbt's checkNativeLinkEnv refuses proxyServer / Compile / nativeLink
# without it. Workflow-level so every job's sbt sees it. Keep in sync with
# build.yml.
env:
  SCALANATIVE_GC_TRAP_BASED_YIELDPOINTS: "0"

# Read-only by default. The release job alone gets contents: write, for the
# GitHub release. The tap job pushes to kevin-lee/homebrew-tap with
# HOMEBREW_TAP_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9

      - name: Run core tests
        run: sbt "clean; coreJVM/test; coreJS/test; proxyServer/test; renderer/test"

  build:
    needs: test
    # Scala.js fullLinkJS (Closure full optimization) is heap-hungry; the sbt
    # launcher default of 1 GB OOMs during the renderer link. .jvmopts sets the
    # heap for local + CI builds; this reasserts it in CI in case a runner image
    # ignores .jvmopts. Keep the two in sync.
    env:
      SBT_OPTS: "-Xms1G -Xmx4G -XX:+UseG1GC -XX:ReservedCodeCacheSize=512m"
    strategy:
      # One arch failing must not cancel the other: the surviving job's log is
      # what tells us whether a failure is arch-specific (a runner image, a
      # native binary) or common to both. v0.4.0's first attempt cancelled the
      # x64 job mid-build, leaving only the arm64 signing failure to go on.
      fail-fast: false
      matrix:
        include:
          # Apple Silicon runner → arm64 build
          - os: macos-latest
            arch: arm64
          # Intel runner → x64 build. Required: the Scala Native proxy binary is
          # compiled for the host CPU, so an arm64 runner would produce an x64
          # DMG containing an arm64 binary that cannot run on Intel Macs.
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

#      - name: Build native proxy binary
#        run: sbt proxyServer/nativeLink
#
#      - name: Build Scala.js Electron main
#        run: sbt electron/fullLinkJS
      - name: Build binary for production
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
        run: sbt "clean; prodUi"

#      - name: Assemble electron-app
#        run: |
#          cp modules/claude-proxymate-server/target/scala-3.3.7/claude-proxymate-server-out electron-app/claude-proxy
#          chmod +x electron-app/claude-proxy
#          cp modules/claude-proxymate-electron/target/scala-3.3.7/claude-proxymate-electron-opt/main.js electron-app/main.js
#          cp -r public electron-app/public
#          cp -r assets electron-app/assets

      - name: Install Electron dependencies
        run: cd electron-app && npm install

      # Signs with the Developer ID cert from CSC_LINK and notarizes via the
      # APPLE_* credentials ("notarize": true in project/package.json.template;
      # hardenedRuntime + entitlements are configured there too). Required repo
      # secrets:
      #   CSC_LINK                     base64-encoded Developer ID .p12
      #   CSC_KEY_PASSWORD             password for the .p12
      #   APPLE_ID                     Apple ID email of the developer account
      #   APPLE_APP_SPECIFIC_PASSWORD  app-specific password (appleid.apple.com)
      #   APPLE_TEAM_ID                10-char team ID
      # Degradation is graceful and verified against app-builder-lib source:
      # with NO credentials set, electron-builder ad-hoc signs and skips
      # notarization with a warning (downloaders then need the Gatekeeper
      # workaround in the README); with PARTIAL credentials it fails the build.
      #
      # electron-builder must be >= 26.16.1 (pinned in
      # project/package.json.template). Up to 26.15.3 it passed the .p12
      # password to `security set-key-partition-list -k`, which wants the
      # temporary keychain's own password. That mismatch was harmless while
      # macos-latest was macOS 15 or older, because SecKeychainUnlock returned
      # success on an already-unlocked keychain, and became fatal the moment
      # macos-latest moved to macOS 26 ("SecKeychainUnlock: The user name or
      # passphrase you entered is not correct", v0.4.0's first attempt).
      # Beware the version range: npm prefers the version tagged `latest` over
      # any higher one that also satisfies the range, and 26.16.x shipped under
      # the `v26` tag while `latest` stayed on the broken 26.15.3, so `^26.8.1`
      # resolved to 26.15.3. The floor has to sit above `latest` to win.
      #
      # The template's mac.target deliberately has NO "arch" list: an explicit
      # arch list in config overrides the CLI --arm64/--x64 flag, which made
      # each runner cross-build BOTH arches. The x64 DMG built on the arm64
      # runner contained an arm64 native proxy binary (broken on Intel), and
      # the duplicate filenames across artifacts corrupted the merged release
      # assets (v0.1.0). Keep arch selection on the CLI flag only.
      # Do NOT set CSC_IDENTITY_AUTO_DISCOVERY=false here: it suppresses
      # electron-builder's ad-hoc signing fallback and yields an app with no
      # bundle seal, which macOS reports as "damaged" with no Open Anyway
      # escape (v0.1.0). With auto-discovery on and no identity in the
      # keychain, electron-builder ad-hoc signs, giving downloaders the
      # recoverable Gatekeeper flow instead.
      - name: Package with electron-builder
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cd electron-app && npx electron-builder --mac --${{ matrix.arch }}

      # Guard against the failure modes that broke v0.1.0: a runner building
      # more than its own arch, a DMG whose bundled native proxy binary doesn't
      # match the DMG's arch, and (when signing credentials are configured) an
      # app that isn't actually Developer-ID signed + notarized + stapled.
      - name: Verify DMG
        env:
          HAS_SIGNING: ${{ secrets.CSC_LINK != '' }}
        run: |
          set -euo pipefail
          cd electron-app/release
          DMGS=(*.dmg)
          if [ "${#DMGS[@]}" -ne 1 ]; then
            echo "Expected exactly 1 DMG for ${{ matrix.arch }}, got: ${DMGS[*]}"
            exit 1
          fi
          hdiutil verify "${DMGS[0]}"
          MNT=$(hdiutil attach "${DMGS[0]}" -nobrowse -readonly | awk -F'\t' '/\/Volumes\//{print $NF}')
          trap 'hdiutil detach "$MNT" -quiet' EXIT
          # At minimum an ad-hoc signature with a valid resource seal; a
          # seal-less app is reported by macOS as "damaged" with no recovery.
          codesign --verify --deep --strict "$MNT/Claude Proxymate.app"
          if [ "$HAS_SIGNING" = "true" ]; then
            # Fail the release if the app is not Developer-ID signed, accepted
            # by Gatekeeper as notarized, and carrying a stapled ticket.
            codesign -dvvv "$MNT/Claude Proxymate.app" 2>&1 | grep "Authority=Developer ID Application"
            spctl -a -vvv "$MNT/Claude Proxymate.app"
            xcrun stapler validate "$MNT/Claude Proxymate.app"
          else
            echo "No signing credentials configured — shipping ad-hoc signed build."
          fi
          EXPECTED="${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"
          for bin in "Contents/MacOS/Claude Proxymate" "Contents/Resources/claude-proxymate"; do
            ARCH_INFO=$(file "$MNT/Claude Proxymate.app/$bin")
            echo "$ARCH_INFO"
            if ! echo "$ARCH_INFO" | grep -q "$EXPECTED"; then
              echo "ERROR: $bin is not $EXPECTED"
              exit 1
            fi
          done

      # Taken after electron-builder has finished and the read-only
      # verification above has run, so it describes the bytes that are uploaded
      # and published. The release and tap jobs check every copy against it.
      # Verify DMG has already checked that there is exactly one DMG.
      - name: Write the DMG checksum
        run: |
          set -euo pipefail
          cd electron-app/release
          DMGS=(*.dmg)
          shasum -a 256 "${DMGS[0]}" > "${DMGS[0]}.sha256"
          shasum -a 256 -c "${DMGS[0]}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: |
            electron-app/release/*-${{ matrix.arch }}.dmg
            electron-app/release/*-${{ matrix.arch }}.dmg.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # Each artifact now carries only its own arch's DMG and checksum file, so
      # merge-multiple cannot collide. Assert we have exactly one DMG and one
      # checksum file per arch, and that every DMG matches the checksum written
      # in its build job, before publishing anything.
      - name: Sanity-check artifacts
        run: |
          set -euo pipefail
          ls -la artifacts/
          for arch in arm64 x64; do
            COUNT=$(ls artifacts/*-"$arch".dmg 2>/dev/null | wc -l)
            if [ "$COUNT" -ne 1 ]; then
              echo "ERROR: expected exactly 1 $arch DMG, found $COUNT"
              exit 1
            fi
            COUNT=$(ls artifacts/*-"$arch".dmg.sha256 2>/dev/null | wc -l)
            if [ "$COUNT" -ne 1 ]; then
              echo "ERROR: expected exactly 1 $arch checksum file, found $COUNT"
              exit 1
            fi
          done
          (cd artifacts && sha256sum -c ./*.sha256)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.sha256
          generate_release_notes: true

  tap:
    needs: release
    # brew style needs Homebrew.
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Require the tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "error: repository secret HOMEBREW_TAP_TOKEN is not set"
            exit 1
          fi

      # This repository, for scripts/update-cask.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kevin-lee/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # The published release assets are what brew downloads, so they are the
      # files checked. Each DMG is checked against the .sha256 written in its
      # build job, so a corrupted download fails here instead of reaching the
      # cask.
      - name: Download the published DMGs and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --pattern '*.dmg.sha256' --dir release-assets
          ls -la release-assets

      - name: Update the cask
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for arch in arm64 x64; do
            NAME="Claude-Proxy-$VERSION-$arch.dmg"
            for file in "release-assets/$NAME" "release-assets/$NAME.sha256"; do
              if [ ! -f "$file" ]; then
                echo "error: $file not found"
                exit 1
              fi
            done
            (cd release-assets && shasum -a 256 -c "$NAME.sha256")
          done
          ARM="$(awk '{print $1}' "release-assets/Claude-Proxy-$VERSION-arm64.dmg.sha256")"
          X64="$(awk '{print $1}' "release-assets/Claude-Proxy-$VERSION-x64.dmg.sha256")"
          scripts/update-cask.sh "$VERSION" "$ARM" "$X64" tap
          git -C tap add Casks

      # brew style only inspects casks that live inside a tap directory, so the
      # checkout is linked into Homebrew's taps folder under the real tap name
      # and the casks are named by token. Only the changed casks are checked,
      # so older hand-written casks cannot fail a release under newer RuboCop
      # rules.
      - name: Check the cask style
        run: |
          set -euo pipefail
          TAP_DIR="$(brew --repository)/Library/Taps/kevin-lee/homebrew-tap"
          mkdir -p "$(dirname "$TAP_DIR")"
          ln -sfn "$GITHUB_WORKSPACE/tap" "$TAP_DIR"
          TOKENS=()
          while IFS= read -r cask; do
            TOKENS+=("kevin-lee/tap/$(basename "$cask" .rb)")
          done < <(git -C tap diff --cached --name-only -- Casks)
          if [ "${#TOKENS[@]}" -eq 0 ]; then
            echo "No cask changes to check."
            exit 0
          fi
          brew style --cask "${TOKENS[@]}"

      - name: Commit and push
        run: |
          set -euo pipefail
          cd tap
          if git diff --cached --quiet; then
            echo "No cask changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="${GITHUB_REF_NAME#v}"
          TITLE="Update \`claude-proxymate\` to \`$VERSION\`"
          PREVIOUS=""
          PREVIOUS_FILE=$(git diff --cached --name-only --diff-filter=A | grep 'Casks/claude-proxymate@' | sort -V | tail -n 1 || true)
          if [ -n "$PREVIOUS_FILE" ]; then
            PREVIOUS=$(basename "$PREVIOUS_FILE" .rb)
            PREVIOUS="${PREVIOUS#claude-proxymate@}"
            TITLE="$TITLE and add versioned cask for \`$PREVIOUS\`"
          fi
          if [ -n "$PREVIOUS" ]; then
            git commit -m "$TITLE" -m "- \`claude-proxymate\`: \`$PREVIOUS\` => \`$VERSION\`"
          else
            git commit -m "$TITLE"
          fi
          # Picks up a tap push from another release, such as token-watchroo's,
          # made since the checkout.
          git pull --rebase origin main
          git push origin HEAD:main
