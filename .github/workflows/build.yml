name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Scala Native 0.5.x release builds default to trap-based GC yieldpoints, which
# lose fault delivery under concurrent load on macOS and wedge the proxy binary.
# The toolchain reads this from the sbt JVM's environment at link time, and
# build.sbt's checkNativeLinkEnv refuses proxyServer / Compile / nativeLink
# without it. Workflow-level so every job's sbt sees it. Keep in sync with
# release.yml.
env:
  SCALANATIVE_GC_TRAP_BASED_YIELDPOINTS: "0"

# Read-only: no job writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: sbt/setup-sbt@b113b960ba361e87e08ce02a390d51871b7ee459 # v1.5.13

      - name: Run core tests
        run: sbt "coreJVM/test; coreJS/test; coreNative/test; proxyServer/test; renderer/test; electron/test"

  electron-mac:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    # Scala.js fullLinkJS (Closure full optimization) is heap-hungry; the sbt
    # launcher default of 1 GB OOMs during the renderer link. .jvmopts sets the
    # heap for local + CI builds; this reasserts it in CI in case a runner image
    # ignores .jvmopts. Keep in sync with release.yml.
    env:
      SBT_OPTS: "-Xms1G -Xmx4G -XX:+UseG1GC -XX:ReservedCodeCacheSize=512m"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: sbt/setup-sbt@b113b960ba361e87e08ce02a390d51871b7ee459 # v1.5.13

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # proxyServer/test runs here too, because EvpDigestShimSpec must run on
      # macOS, where it tests the libcrypto digest shim
      # (claudeproxymate_evp_digest_darwin.c, issue #95). The test job runs on
      # Linux, where the real libcrypto is used.
      - name: Run proxy server tests on macOS
        run: sbt proxyServer/test

      # EvpDigestShimSpec gives the same values with Homebrew's libcrypto, so
      # only this check shows that the test binary used the shim. It must run
      # before prodUi, because prodUi runs clean first.
      - name: Check the proxy test binary's load commands
        run: scripts/check-macos-load-commands.sh modules/claude-proxymate-server/target/scala-*/claude-proxymate-server-test

      - name: Build binary for production
        run: sbt prodUi

      - name: Test the load command check script
        run: scripts/test-check-macos-load-commands.sh

      # Issue #95: a load command for a library outside the system folders (for
      # example Homebrew's libcrypto) stops the proxy at start on a Mac without
      # that file. Keep in sync with release.yml.
      - name: Check the proxy binary's load commands
        run: scripts/check-macos-load-commands.sh electron-app/claude-proxymate

      - name: Install Electron dependencies
        run: cd electron-app && npm install

      # Issue #95: checks that the app shows the cause when the proxy stops before or after it started, and that a
      # normal stop shows nothing. It uses the prodUi build from the step before.
      - name: Run the Electron end-to-end test
        run: cd scripts/e2e && npm ci && npm test

      # Smoke check only: no signing credentials are passed, so electron-builder
      # ad-hoc signs and skips notarization (graceful degradation, verified in
      # release.yml's comments). This deliberately avoids the slow notarization
      # round-trip.
      - name: Package with electron-builder (unsigned)
        run: cd electron-app && npx electron-builder --mac --arm64 --publish never

      # Reduced version of release.yml's verify: this job never has signing
      # credentials. The codesign seal check is intentionally omitted here —
      # electron-builder's ad-hoc seal trips `codesign --verify --deep --strict`
      # ("code has no resources but signature indicates they must be present")
      # on the runner, and the signed verification belongs to release.yml
      # anyway. This smoke check only asserts that packaging produced exactly
      # one valid arm64 DMG whose bundled binaries are arm64.
      - name: Verify DMG (unsigned smoke)
        run: |
          set -euo pipefail
          cd electron-app/release
          DMGS=(*.dmg)
          if [ "${#DMGS[@]}" -ne 1 ]; then
            echo "Expected exactly 1 arm64 DMG, got: ${DMGS[*]}"
            exit 1
          fi
          hdiutil verify "${DMGS[0]}"
          MNT=$(hdiutil attach "${DMGS[0]}" -nobrowse -readonly | awk -F'\t' '/\/Volumes\//{print $NF}')
          trap 'hdiutil detach "$MNT" -quiet' EXIT
          for bin in "Contents/MacOS/Claude Proxymate" "Contents/Resources/claude-proxymate"; do
            ARCH_INFO=$(file "$MNT/Claude Proxymate.app/$bin")
            echo "$ARCH_INFO"
            if ! echo "$ARCH_INFO" | grep -q "arm64"; then
              echo "ERROR: $bin is not arm64"
              exit 1
            fi
          done
          # Issue #95: the packaged proxy binary must load only system libraries.
          "$GITHUB_WORKSPACE/scripts/check-macos-load-commands.sh" "$MNT/Claude Proxymate.app/Contents/Resources/claude-proxymate"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-arm64
          path: electron-app/release/*-arm64.dmg
