name: "PR Labeler"
on:
  pull_request_target:
    types: [ opened, reopened, edited ]

permissions:
  contents: read

jobs:
  pr-labeler:
    runs-on: ubuntu-latest
    # The labeler reads .github/pr-labeler.yml through the API (contents: read)
    # and adds labels to the pull request (pull-requests: write). A job-level
    # block replaces the top-level one, so contents: read is listed again.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: TimonVS/pr-labeler-action@f9c084306ce8b3f488a8f3ee1ccedc6da131d1af # v5.0.0
        with:
          configuration-path: .github/pr-labeler.yml # optional, .github/pr-labeler.yml is the default value
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
